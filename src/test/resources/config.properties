# Base configuration. Override any key via -D on the command line,
# e.g. mvn test -Dbase.url=https://staging.my-api.local
base.url=https://api.example.com
base.path=/v1
timeout.ms=15000

# Path to the OpenAPI/Swagger spec, relative to src/test/resources
openapi.spec=openapi/swagger.json

# Auth: none | bearer | basic | apikey
auth.type=none
auth.token=
auth.username=
auth.password=
auth.apikey.header=X-API-Key
auth.apikey.value=

# Log request/response bodies on failure only: true | false (true = always)
log.all=false
